# Xiaohongshu Crawler Configuration

# Crawler settings
crawler:
  timeout: 60
  retry_times: 3
  delay_range:
    min: 1
    max: 5
  request_interval: 1  # 请求间隔时间（秒）
  max_pages: 1  # 最大爬取页面数
  user_agents:
    - "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
    - "Mozilla/5.0 (Macintosh; Intel Mac OS X 14_2) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.2 Safari/605.1.15"
  proxies: []
  # cookies_str 已迁移到 .env 文件中

# Parser settings
parser:
  max_comments: 100
  max_notes: 10

# Storage settings
storage:
  base_dir: "./data"

# Logging settings
logging:
  level: "INFO"
  file: "./logs/seer.log"
  max_bytes: 10485760
  backup_count: 5

# Dividend rate settings
dividend_rate:
  data_source:
    source: "eastmoney"  # 数据源: eastmoney, sina, tencent
    api_timeout: 30
    retry_times: 3
    use_cache: true
    cache_expire_hours: 24
    max_workers: 20  # 并发工作进程数（进程池可以安全使用更高的并发数）
    request_interval: 0.5  # 请求间隔（秒）
  calculation:
    high_dividend_threshold: 4.0  # 高股息率阈值(%)
    ttm_months: 12  # TTM计算月数
    min_dividend_years: 3  # 最少分红年数
    dividend_growth_threshold: 5.0  # 股息增长阈值(%)
  filter:
    default_min_yield: 0.0
    default_max_yield: 100.0
    default_min_pe: 0.0
    default_max_pe: 1000.0
    default_min_market_cap: 0.0
    default_max_market_cap: 100000.0
  storage:
    cache_dir: "./cache/dividend"
    data_dir: "./data/dividend"
    enable_persistence: true
