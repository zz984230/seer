[project]
name = "seer"
version = "0.1.0"
description = "Xiaohongshu crawler application"
authors = [{ name = "Your Name", email = "your.email@example.com" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.40.0",
    "beautifulsoup4>=4.12.0",
    "pydantic-settings>=2.1.0",
    "requests>=2.31.0",
    "pyyaml>=6.0.0",
    "pyexecjs>=1.5.1",
    "loguru>=0.7.3",
    "python-dotenv>=1.0.0",
    "retry>=0.9.2",
    "openpyxl>=3.1.0",
    "akshare>=1.12.0",
    "pandas>=2.0.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

